# ─────────────────────────────────────────────────────────────────────────────
# ArD.net — docker compose (produksi / test)
#
# Persiapan pertama (sekali, WAJIB — bila tidak, Docker membuat folder kosong
# di tempat yang seharusnya berisi file settings.json):
#   mkdir -p docker-data/config docker-data/database docker-data/logs \
#            docker-data/uploads docker-data/baileys docker-data/backups
#   echo '{"server_port":3001,"cookie_secure":false}' > docker-data/config/settings.json
#
# Jalankan:
#   docker compose up -d --build
#   docker compose logs -f
#
# Catatan:
# - Semua DATA (settings, DB, log, upload, sesi WhatsApp, backup) tersimpan di
#   ./docker-data  → aman saat container di-update. Backup cukup folder ini
#   (salin juga ke lokasi LAIN, bukan hanya di server yang sama).
# - settings.json berada di docker-data/config/ dan dibaca lewat SETTINGS_PATH.
# - Port 1812/1813 UDP hanya diperlukan bila memakai server RADIUS bawaan;
#   hapus kedua baris port itu bila tidak dipakai.
# - Ganti cookie_secure ke true bila diakses via HTTPS/reverse-proxy TLS.
# ─────────────────────────────────────────────────────────────────────────────
services:
  ard-net:
    build: .
    image: ard-net:0.6.17
    container_name: ard-net
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "8099:8099"   # redirector halaman isolir
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - SETTINGS_PATH=/app/settings-data/settings.json
    volumes:
      - ./docker-data/config:/app/settings-data
      - ./docker-data/database:/app/database
      - ./docker-data/logs:/app/logs
      - ./docker-data/uploads:/app/public/uploads
      - ./docker-data/baileys:/app/auth_info_baileys
      - ./docker-data/backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/version.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
